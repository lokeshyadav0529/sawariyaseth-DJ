<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sumit Parta </title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a1a, #000);
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: #111;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }

    .logo {
      font-size: 1.4rem;
      font-weight: bold;
      color: #0ff;
    }

    .search-bar input {
      padding: 8px 12px;
      border-radius: 20px;
      border: none;
      outline: none;
      width: 200px;
      max-width: 50vw;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-y: auto;
    }

    /* Playlist Section */
    .playlist {
      width: 100%;
      max-width: 600px;
    }
    .playlist h1 {
      margin-bottom: 20px;
      color: #0ff;
      font-size: 1.6rem;
    }
    .playlist ul {
      list-style: none;
      padding: 0;
      margin: 0;
      width: 100%;
    }
    .playlist li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 15px;
      margin: 8px 0;
      background: #222;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .playlist li:hover {
      background: #333;
    }
    .song-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .song-info img {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      object-fit: cover;
    }
    .song-details {
      display: flex;
      flex-direction: column;
    }
    .song-title {
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
    }
    .song-artist {
      font-size: 0.85rem;
      color: #bbb;
    }

    /* Player Section */
    .player-view {
      flex: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .player-cover img {
      width: 260px;
      height: 260px;
      object-fit: cover;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }
    .player-info {
      text-align: center;
      margin-bottom: 15px;
    }
    .player-info h2 {
      color: #0ff;
      font-size: 1.4rem;
      margin: 5px 0;
    }
    .player-info p {
      font-size: 0.9rem;
      color: #bbb;
    }
    .player-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
    }
    .player-controls div {
      display: flex;
      gap: 25px;
    }
    .player-controls button {
      background: none;
      border: none;
      font-size: 2rem;
      color: #fff;
      cursor: pointer;
    }
    .player-controls button:hover {
      color: #0ff;
    }
    .player-controls input[type="range"] {
      width: 80%;
      accent-color: #0ff;
    }
    .back-btn {
      margin-top: 20px;
      background: #0ff;
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }
    .back-btn:hover {
      background: #00cccc;
    }

    /* Mobile Responsive */
    @media (max-width: 600px) {
      .playlist li {
        padding: 10px;
      }
      .song-info img {
        width: 45px;
        height: 45px;
      }
      .song-title {
        font-size: 0.95rem;
      }
      .song-artist {
        font-size: 0.75rem;
      }
      .player-cover img {
        width: 200px;
        height: 200px;
      }
      .player-info h2 {
        font-size: 1.2rem;
      }
    }
    header {
  background: #000;
  color: #fff;
  padding: 12px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-img {
  height: 55px;
  width: 55px;
  border-radius: 50%;  /* circular logo */
  object-fit: cover;
  border: 2px solid #0ff; /* stylish border */
}

.logo-text {
  font-size: 1.6rem;
  font-weight: bold;
  color: #0ff;
  letter-spacing: 1px;
}

nav a {
  color: #ccc;
  margin: 0 14px;
  text-decoration: none;
  font-weight: bold;
  transition: 0.3s;
}

nav a:hover {
  color: #0ff;
}

/* Responsive nav for mobile */
@media (max-width: 700px) {
  header {
    flex-direction: column;
    align-items: flex-start;
  }
  nav {
    margin-top: 10px;
  }
}

  </style>
</head>
<body>
  <header>
  <div class="logo">
    <img src="sumit.jpeg" alt="Massom Sharma" class="logo-img">
    <span class="logo-text">Sumit Parta  </span>
  </div>
  <nav>
    <a href="index2.html">Home</a>
    <a href="#">Albums</a>
    <a href="artist.html">Artists</a>
    <a href="#">Contact</a>
  </nav>
</header>
<main>
    <!-- Playlist Section -->
    <div class="playlist" id="playlistSection">
      <h1>🎵 All Songs</h1>
      <ul id="songList"></ul>
    </div>

    <!-- Player Section -->
    <div class="player-view" id="playerView">
      <div class="player-cover">
        <img id="playerCover" src="" alt="Song Cover">
      </div>
      <div class="player-info">
        <h2 id="playerTitle">Song Title</h2>
        <p id="playerArtist">Artist Name</p>
      </div>
      <div class="player-controls">
        <div>
          <button id="prev">⏮️</button>
          <button id="play">▶️</button>
          <button id="next">⏭️</button>
        </div>
        <input type="range" id="seekbar" value="0" min="0" max="100" />
      </div>
      <button class="back-btn" id="backBtn">⬅ Back to Playlist</button>
    </div>
  </main>

  <script>


const songs = [
  { title: "Sumit_Parta_Ghane_Gande",artist: "Sumit Parta", src: "songs/51.mp3", img: "covers/51.jpeg" },
  { title: "Sumit_Parta_Mote_Peg_2",artist: "Sumit Parta",   src: "songs/52.mp3", img: "covers/52.jpeg" },
  { title: "Sumit_Parta_Mote_Peg_", artist: "Sumit Parta", src: "songs/53.mp3", img: "covers/53.jpeg" },
  { title: "Sumit_Parta_-_Rail", artist: "Sumit Parta", src: "songs/54.mp3", img: "covers/54.jpeg" },
  { title: "Sumit_Parta_Tarraki", artist: "Sumit Parta", src: "songs/55.mp3", img: "covers/55.jpeg" },
   { title: "Sumit_parta_Pistol", artist: "Sumit Parta", src: "songs/56.mp3", img: "covers/56.jpeg" },
  { title: "Sumit_Parta_All_About_Haryana", artist: "Sumit Parta", src: "songs/57.mp3", img: "covers/57.jpeg" },
  { title: "Sumit_Parta_Angreji_Bole", artist: "Sumit Parta", src: "songs/58.mp3", img: "covers/58.jpeg" },
  { title: "Sumit_Parta_Badam_", artist: "Sumit Parta", src: "songs/59.mp3", img: "covers/59.jpeg" },
  { title: "Sumit_Parta_Bhartar_", artist: "Sumit Parta", src: "songs/60.mp3", img: "covers/60.jpeg" },
   { title: "Sumit_Parta_Chawal", artist: "Sumit Parta", src: "songs/61.mp3", img: "covers/61.jpeg" },
  { title: "Sumit_Parta_Demand", artist: "Sumit Parta", src: "songs/62.mp3", img: "covers/62.jpeg" },
  { title: "Sumit_Parta_-_Gaam_Mera", artist: "Sumit Parta", src: "songs/63.mp3", img: "covers/63.jpeg" },
  { title: "Sumit_Parta_-_Jaat", artist: "Sumit Parta", src: "songs/64.mp3", img: "covers/64.jpeg" },
  { title: "Sumit_Parta_-_Kade_Kade", sartist: "Sumit Parta", rc: "songs/65.mp3", img: "covers/65.jpeg" },
   { title: "Sumit_Parta_Maa_Babu", artist: "Sumit Parta", src: "songs/66.mp3", img: "covers/66.jpeg" },
  { title: "Sumit_Parta_Peg_Marke", artist: "Sumit Parta", src: "songs/67.mp3", img: "covers/67.jpeg" },
  { title: "Sumit_Parta_2_Numbari", artist: "Sumit Parta", src: "songs/68.mp3", img: "covers/68.jpeg" },
  { title: "Sumit_Parta_Na_Kre_Badmashi_", artist: "Sumit Parta", src: "songs/69.mp3", img: "covers/69.jpeg" },
  { title: "Sumit_Parta_Angreji_Bole", artist: "Sumit Parta", src: "songs/70.mp3", img: "covers/70.jpeg" }
];
    let current = 0;
    let isPlaying = false;
    const audio = new Audio();

    const songList = document.getElementById("songList");
    const playlistSection = document.getElementById("playlistSection");
    const playerView = document.getElementById("playerView");
    const playerCover = document.getElementById("playerCover");
    const playerTitle = document.getElementById("playerTitle");
    const playerArtist = document.getElementById("playerArtist");
    const playBtn = document.getElementById("play");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");
    const seekbar = document.getElementById("seekbar");
    const backBtn = document.getElementById("backBtn");

    // Load songs in playlist
    songs.forEach((song, index) => {
      const li = document.createElement("li");
      li.innerHTML = `
        <div class="song-info">
          <img src="${song.img}" alt="${song.title}">
          <div class="song-details">
            <span class="song-title">${song.title}</span>
            <span class="song-artist">${song.artist}</span>
          </div>
        </div>
      `;
      li.addEventListener("click", () => loadTrack(index));
      songList.appendChild(li);
    });

    function loadTrack(index) {
      current = index;
      audio.src = songs[current].src;

      playlistSection.style.display = "none";
      playerView.style.display = "flex";

      playerCover.src = songs[current].img;
      playerTitle.textContent = songs[current].title;
      playerArtist.textContent = songs[current].artist;

      if (isPlaying) audio.play();
    }

    function playPause() {
      if (isPlaying) {
        audio.pause();
        playBtn.textContent = "▶️";
      } else {
        audio.play();
        playBtn.textContent = "⏸️";
      }
      isPlaying = !isPlaying;
    }

    function prevTrack() {
      current = (current - 1 + songs.length) % songs.length;
      loadTrack(current);
      audio.play();
      isPlaying = true;
      playBtn.textContent = "⏸️";
    }

    function nextTrack() {
      current = (current + 1) % songs.length;
      loadTrack(current);
      audio.play();
      isPlaying = true;
      playBtn.textContent = "⏸️";
    }

    audio.addEventListener("timeupdate", () => {
      seekbar.value = (audio.currentTime / audio.duration) * 100 || 0;
    });

    seekbar.addEventListener("input", () => {
      audio.currentTime = (seekbar.value / 100) * audio.duration;
    });

    playBtn.addEventListener("click", playPause);
    prevBtn.addEventListener("click", prevTrack);
    nextBtn.addEventListener("click", nextTrack);

    // Back to Playlist
    backBtn.addEventListener("click", () => {
      audio.pause();
      isPlaying = false;
      playBtn.textContent = "▶️";
      playerView.style.display = "none";
      playlistSection.style.display = "block";
    });
  </script>
</body>
</html>
