<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SANWARIYA SETH DJ</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #000;
      color: #fff;
    }

    header {
      background: #111;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-img {
      width: 40px;
      height: 40px;
    }

    .logo strong {
      font-size: 16px;
    }

    nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      padding: 5px 10px;
      border-radius: 5px;
      background: #222;
    }

    nav a:hover {
      background: #333;
    }

    main {
      padding: 15px;
      text-align: center;
    }

    .playlist h1 {
      font-size: 20px;
      color: #ffcc00;
      margin-bottom: 10px;
    }

    .main-image img {
      width: 100%;
      max-width: 360px;
      border-radius: 10px;
    }

    footer {
      background: #111;
      padding: 10px;
      position: sticky;
      bottom: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .now-playing {
      font-size: 14px;
      color: #ccc;
    }

    .controls {
      display: flex;
      gap: 15px;
      justify-content: center;
      align-items: center;
    }

    .controls button {
      background: #333;
      color: #fff;
      font-size: 18px;
      padding: 6px 10px;
      border: none;
      border-radius: 5px;
    }

    .controls button:hover {
      background: #555;
    }

    #gif {
      height: 25px;
      display: none;
    }

    #seekbar {
      width: 100%;
    }

    @media (max-width: 480px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }

      nav {
        justify-content: flex-start;
        flex-direction: column;
        align-items: flex-start;
      }

      .logo strong {
        font-size: 14px;
      }

      nav a {
        font-size: 13px;
      }

      .controls button {
        font-size: 16px;
        padding: 5px 8px;
      }

      .playlist h1 {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <img src="SAWARIYA_SETH.png" alt="DJ Logo" class="logo-img">
      <strong>SAWARIYA SETH</strong>
    </div>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="playlist1.html">Playlist</a>
    </nav>
  </header>

  <main>
    <div class="playlist">
      <h1>SANWARIYA SETH BEST BHAJAN</h1>
      <ul id="songList"></ul>
    </div>
    <div class="main-image">
      <img src="images/s1.jpg" alt="DJ Cover Image" />
    </div>
  </main>

  <footer>
    <div id="nowPlayingFooter" class="now-playing">Now Playing: --</div>
    <div class="controls">
      <img src="playing.gif" id="gif" alt="Playing" />
      <button id="prev">⏮️</button>
      <button id="play">▶️</button>
      <button id="next">⏭️</button>
    </div>
    <input type="range" id="seekbar" value="0" min="0" max="100" />
  </footer>

  <script src="script.js"></script>
</body>
</html>
